<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Aryan Shah — AI engineer, founder of SORAEN, India. Build intelligence. Engineer the future. Make AI safer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0d0c24"/>
      <stop offset="1" stop-color="#1a1744"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#818cf8" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="motto"><rect x="70" y="236" width="0" height="34"><animate attributeName="width" values="0;640;640;0" keyTimes="0;0.35;0.9;1" dur="8s" begin="1s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      text { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .pulse { animation: pulse 6s ease-in-out infinite; transform-origin: 960px 128px; }
      .rise { opacity: 0; animation: rise 1s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s }
      .node { animation: blink 3s ease-in-out infinite; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.4s }
      .flow { stroke-dasharray: 6 8; animation: dash 2.5s linear infinite; }
      .ring { transform-origin: 960px 128px; animation: spin 24s linear infinite; }
      .caret { animation: caret 1s steps(1) infinite; }
      @keyframes pulse { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      @keyframes blink { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes dash { to { stroke-dashoffset: -28 } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes caret { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)" class="pulse"/>

  <g class="rise d1">
    <text x="70" y="88" class="mono" font-size="14" fill="#818cf8" letter-spacing="3">AI ENGINEER · FOUNDER @ SORAEN · INDIA</text>
  </g>
  <g class="rise d2">
    <text x="66" y="162" font-size="72" font-weight="700" fill="url(#name)" letter-spacing="-1.5">Aryan Shah</text>
  </g>
  <g class="rise d3">
    <text x="70" y="204" font-size="19" fill="#94a3b8">LLMs · agentic systems · AI safety &amp; security</text>
  </g>
  <g class="mono" font-size="18">
    <text x="70" y="259" fill="#64748b">&gt;</text>
    <g clip-path="url(#motto)">
      <text x="92" y="259" fill="#e0e7ff">Build intelligence. Engineer the future. Make AI safer.</text>
    </g>
    <text x="700" y="259" fill="#818cf8" class="caret">▍</text>
  </g>

  <!-- right: neural core -->
  <circle class="ring" cx="960" cy="128" r="86" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-dasharray="2 10"/>
  <circle cx="960" cy="128" r="56" fill="none" stroke="#6366f1" stroke-opacity="0.25"/>
  <g stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.6">
    <path class="flow" d="M960 128 L880 70"/>
    <path class="flow" d="M960 128 L1050 60"/>
    <path class="flow" d="M960 128 L1080 170"/>
    <path class="flow" d="M960 128 L1000 240"/>
    <path class="flow" d="M960 128 L870 200"/>
    <path class="flow" d="M880 70 L1050 60 M1080 170 L1000 240 L870 200"/>
  </g>
  <g fill="#a5b4fc">
    <circle class="node" cx="880" cy="70" r="5"/>
    <circle class="node n2" cx="1050" cy="60" r="5"/>
    <circle class="node n3" cx="1080" cy="170" r="5"/>
    <circle class="node n4" cx="1000" cy="240" r="5"/>
    <circle class="node n5" cx="870" cy="200" r="5"/>
  </g>
  <circle cx="960" cy="128" r="12" fill="#6366f1" stroke="#e0e7ff" stroke-width="2"/>
  <circle cx="960" cy="128" r="4" fill="#ffffff"/>
</svg>
