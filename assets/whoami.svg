<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="Terminal: whoami — Aryan Shah. Role: AI engineer and founder of SORAEN. Education: Class 11, PCM, preparing for JEE 2028. Focus: LLMs, AI agents, AI safety and security. Offline: electric guitar, rock and strength training. Languages: English, Hindi. Inspiration: JARVIS.">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; font-size: 15px; }
      .p { fill: #818cf8 } .k { fill: #7dd3fc } .v { fill: #e6edf3 } .c { fill: #6e7681 } .s { fill: #a5d6a7 }
      /* one 18s loop; each line appears at its own moment, everything clears at the end */
      .l { opacity: 0; animation-duration: 18s; animation-iteration-count: infinite; animation-timing-function: steps(1, end); }
      .l1 { animation-name: l1 } .l2 { animation-name: l2 } .l3 { animation-name: l3 } .l4 { animation-name: l4 }
      .l5 { animation-name: l5 } .l6 { animation-name: l6 } .l7 { animation-name: l7 } .l8 { animation-name: l8 }
      .l9 { animation-name: l9 } .l10 { animation-name: l10 } .l11 { animation-name: l11 } .l12 { animation-name: l12 }
      @keyframes l1  { 0%,2%  { opacity: 0 } 3%,94%  { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l2  { 0%,8%  { opacity: 0 } 9%,94%  { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l3  { 0%,14% { opacity: 0 } 15%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l4  { 0%,19% { opacity: 0 } 20%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l5  { 0%,23% { opacity: 0 } 24%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l6  { 0%,27% { opacity: 0 } 28%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l7  { 0%,31% { opacity: 0 } 32%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l8  { 0%,35% { opacity: 0 } 36%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l9  { 0%,39% { opacity: 0 } 40%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l10 { 0%,43% { opacity: 0 } 44%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l11 { 0%,52% { opacity: 0 } 53%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      @keyframes l12 { 0%,58% { opacity: 0 } 59%,94% { opacity: 1 } 95%,100% { opacity: 0 } }
      .caret { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0 } }
    </style>
  </defs>

