<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Animated demo: SORAEN Lite answers with a citation, then admits when the documents don't contain the answer">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      /* one 16s loop; each step fades in at its own point and everything clears at the end */
      .s { opacity: 0; animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
      .s1 { animation-name: s1 } .s2 { animation-name: s2 } .s3 { animation-name: s3 }
      .s4 { animation-name: s4 } .s5 { animation-name: s5 } .s6 { animation-name: s6 }
      @keyframes s1 { 0%,3% { opacity: 0; transform: translateY(8px) } 7%,92% { opacity: 1; transform: none } 97%,100% { opacity: 0 } }
      @keyframes s2 { 0%,12% { opacity: 0; transform: translateY(8px) } 17%,92% { opacity: 1; transform: none } 97%,100% { opacity: 0 } }
      @keyframes s3 { 0%,22% { opacity: 0; transform: translateY(8px) } 27%,92% { opacity: 1; transform: none } 97%,100% { opacity: 0 } }
      @keyframes s4 { 0%,40% { opacity: 0; transform: translateY(8px) } 45%,92% { opacity: 1; transform: none } 97%,100% { opacity: 0 } }
      @keyframes s5 { 0%,52% { opacity: 0; transform: translateY(8px) } 57%,92% { opacity: 1; transform: none } 97%,100% { opacity: 0 } }
      @keyframes s6 { 0%,64% { opacity: 0; transform: translateY(8px) } 69%,92% { opacity: 1; transform: none } 97%,100% { opacity: 0 } }
      .dot { animation: dot 1.2s ease-in-out infinite; }
      .dot2 { animation-delay: .2s } .dot3 { animation-delay: .4s }
      @keyframes dot { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    </style>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="879" height="399" rx="14" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 46 H879.5" stroke="#30363d"/>
  <circle cx="24" cy="23" r="6" fill="#ff5f57"/><circle cx="44" cy="23" r="6" fill="#febc2e"/><circle cx="64" cy="23" r="6" fill="#28c840"/>
  <text x="440" y="28" font-size="13" fill="#8b949e" text-anchor="middle">SORAEN Lite · grounded chat</text>
  <g class="mono" font-size="11">
    <rect x="740" y="13" width="122" height="20" rx="10" fill="#1e1b4b" stroke="#4f46e5"/>
    <text x="801" y="27" fill="#a5b4fc" text-anchor="middle">📎 2 documents</text>
  </g>

  <!-- Q1 -->
  <g class="s s1">
    <rect x="430" y="68" width="426" height="40" rx="12" fill="#4f46e5"/>
    <text x="450" y="93" font-size="15" fill="#fff">What was revenue growth in Q3?</text>
  </g>
  <!-- A1 -->
  <g class="s s2">
    <rect x="24" y="124" width="560" height="62" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="150" font-size="15" fill="#e6edf3">Revenue grew <tspan font-weight="700" fill="#fff">18% year-on-year</tspan> in Q3, driven</text>
    <text x="44" y="172" font-size="15" fill="#e6edf3">mainly by enterprise subscriptions. <tspan fill="#818cf8" font-weight="700">[1]</tspan></text>
  </g>
  <g class="s s3 mono" font-size="12">
    <rect x="24" y="196" width="282" height="26" rx="13" fill="#1e1b4b" stroke="#4f46e5"/>
    <text x="40" y="213" fill="#c7d2fe"><tspan fill="#818cf8">[1]</tspan> annual-report.pdf · page 4 · ¶2</text>
  </g>

  <!-- Q2 -->
  <g class="s s4">
    <rect x="486" y="242" width="370" height="40" rx="12" fill="#4f46e5"/>
    <text x="506" y="267" font-size="15" fill="#fff">Who will be CFO next year?</text>
  </g>
  <!-- A2 -->
  <g class="s s5">
    <rect x="24" y="298" width="560" height="62" rx="12" fill="#161b22" stroke="#a78bfa"/>
    <text x="44" y="324" font-size="15" fill="#e6edf3"><tspan fill="#c4b5fd" font-weight="700">The documents don't say.</tspan> Neither file</text>
    <text x="44" y="346" font-size="15" fill="#e6edf3">mentions future leadership changes, so I won't guess.</text>
  </g>
  <g class="s s6 mono" font-size="12">
    <rect x="600" y="318" width="256" height="26" rx="13" fill="#2e1065" stroke="#a78bfa"/>
    <text x="616" y="335" fill="#ddd6fe">✓ abstained · no source found</text>
  </g>

  <!-- typing indicator -->
  <g fill="#8b949e">
    <circle class="dot" cx="40" cy="384" r="3"/><circle class="dot dot2" cx="52" cy="384" r="3"/><circle class="dot dot3" cx="64" cy="384" r="3"/>
  </g>
</svg>
